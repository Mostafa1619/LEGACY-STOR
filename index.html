<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر ألعاب Steam</title>
    <style>
        body {
            background-color: #171a21;
            color: #c6d4df;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px 20px;
        }
        h1 { color: #66c0f4; }
        .card {
            background-color: #1b2838;
            border-radius: 10px;
            padding: 20px;
            max-width: 400px;
            margin: 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn {
            display: inline-block;
            background-color: #4c6b22;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>🎮 متجر ألعاب Steam</h1>
    <p>أهلاً بك في موقع الألعاب الخاص بك!</p>

    <div class="card">
        <h2>Counter-Strike 2</h2>
        <p>لعبة التصويب التنافسية الأشهر عالمياً.</p>
        <a href="https://store.steampowered.com/app/730/CounterStrike_2/" target="_blank" class="btn">عرض في Steam</a>
    </div>

</body>
</html>
